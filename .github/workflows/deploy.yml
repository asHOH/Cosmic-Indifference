name: Deploy to Tencent Cloud COS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Astro site
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Tencent Cloud COS CLI
        run: pip install coscmd

      - name: Deploy to COS
        env:
          SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          REGION: ${{ secrets.TENCENT_COS_REGION }}
        run: |
          coscmd config -a $SECRET_ID -s $SECRET_KEY -b $BUCKET -r $REGION

          # 1. Sync everything (HTML, etc.) and delete removed files. Default to no-cache.
          coscmd upload -rsf --delete -H "{'Cache-Control': 'no-cache'}" dist/ /

          # 2. Specifically update the video files with a long cache (1 year)
          # -rs skips identical files by hash, but since we want to ensure headers, 
          # we can just run upload targeting the files directly to force their metadata.
          coscmd upload -f -H "{'Cache-Control': 'max-age=31536000, immutable'}" dist/yuzhoulengmo_360p.mp4 /yuzhoulengmo_360p.mp4
          coscmd upload -f -H "{'Cache-Control': 'max-age=31536000, immutable'}" dist/yuzhoulengmo_360p.webm /yuzhoulengmo_360p.webm

          # Optionally do the same for Astro's hashed JS/CSS assets for performance:
          coscmd upload -rsf -H "{'Cache-Control': 'max-age=31536000, immutable'}" dist/_astro/ /_astro/
